name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

defaults:
  run:
    shell: bash -eux {0}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke test (bare install)
        run: |
          python -m pip install .
          python -c "
          import jupyter_mcp_server, importlib, pkgutil
          for mod in pkgutil.walk_packages(jupyter_mcp_server.__path__, 'jupyter_mcp_server.'):
              importlib.import_module(mod.name)
              print(f'  OK: {mod.name}')
          "
          jupyter-mcp-server --help
          jupyter server extension list 2>&1 | grep jupyter_mcp_server

      - name: Install the extension
        run: |
          python -m pip install ".[test,jupyterlab]"
          # Optional extensions. Their tests live beside them and are
          # collected by the root pytest run, so both have to be
          # installed or collection fails before a single test runs.
          python -m pip install ./ext/sandboxes
          python -m pip install ./ext/spaces

      - name: Test the extension
        run: |
          # First: they are quick, need no server, and a failure here
          # is unambiguous — unlike the same tests swept up by the
          # bare pytest of the two runs below.
          make test-extensions
          make test-mcp-server
          make test-jupyter-server
