name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

defaults:
  run:
    shell: bash -eux {0}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke test (bare install)
        run: |
          python -m pip install .
          python -c "
          import jupyter_mcp_server, importlib, pkgutil
          for mod in pkgutil.walk_packages(jupyter_mcp_server.__path__, 'jupyter_mcp_server.'):
              importlib.import_module(mod.name)
              print(f'  OK: {mod.name}')
          "
          jupyter-mcp-server --help
          jupyter server extension list 2>&1 | grep jupyter_mcp_server

      - name: Install the extension
        run: |
          python -m pip install ".[test,jupyterlab]"
          # The optional extension. Its tests live beside it and are
          # collected by the root pytest run, so it has to be installed or
          # collection fails before a single test runs.
          python -m pip install ./extensions/sandboxes

      - name: Test the extension
        run: |
          # First: they are quick, need no server, and a failure here
          # is unambiguous — unlike the same tests swept up by the
          # bare pytest of the two runs below.
          make test-extensions
          make test-mcp-server
          make test-jupyter-server

  test_examples:
    # Each example carries its own tests, driven by pydantic-ai's test models
    # in place of an LLM, so they need no credentials — only the example's
    # dependencies and the servers it starts itself.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the examples
        run: |
          python -m pip install ".[test]"
          python -m pip install -r examples/cli/requirements.txt

      - name: Test the examples
        run: make test-examples
