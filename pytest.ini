[pytest]
addopts = -rqA
; The examples have their own dependencies (pydantic-ai) and servers; they
; run on request, `make test-examples`, not from a bare `pytest`.
norecursedirs = examples .* build dist node_modules venv *.egg
log_cli = true
log_level = INFO
