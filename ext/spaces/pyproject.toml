[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyter_mcp_spaces"
version = "0.1.3"
description = "Datalayer spaces extension for Jupyter MCP Server (list and open the notebooks of a space, in place of a Jupyter filesystem)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Datalayer", email = "info@datalayer.io" }]
keywords = ["jupyter", "mcp", "datalayer", "spaces", "extension"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "datalayer-core>=1.1.60",
    "datalayer-reactor",
    "jupyter-mcp-server",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
build = ["build>=1.2.1", "twine>=5.1.1"]

# Register the extension so Jupyter MCP Server can discover it at startup.
[project.entry-points."jupyter_mcp_server.extensions"]
spaces = "jupyter_mcp_spaces:SpacesExtension"

[project.urls]
Homepage = "https://github.com/datalayer/jupyter-mcp-server"

[tool.setuptools.packages.find]
include = ["jupyter_mcp_spaces*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
